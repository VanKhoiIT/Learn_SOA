# Cong chay Product Service (khac cong 8080 cua buoi 2)
server.port=8081
spring.application.name=product-service

# CSDL H2 Database file
spring.datasource.url=jdbc:h2:file:./data/productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Ket noi xac thuc sang Auth Service buoi 2
auth.service.url=http://localhost:8080/auth
auth.service.shared-secret=KhoaBiMatChoBaiThucHanhSo2SpringbootJwtSecurity2026
auth.service.fallback-local=true

