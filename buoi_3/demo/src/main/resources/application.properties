# ==========================================
# CẤU HÌNH DỊCH VỤ PRODUCT SERVICE (BUỔI 3)
# ==========================================

# 1. Cổng chạy của Product Service (khác cổng 8080 của Auth Service Buổi 2)
server.port=8081
spring.application.name=product-service

# 2. Cấu hình CSDL riêng cho Product Service (H2 File-based Database)
# Dữ liệu được lưu trong thư mục ./data/productdb để không bị mất khi restart
spring.datasource.url=jdbc:h2:file:./data/productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. Giao diện xem CSDL trực quan trên Web (H2 Console)
# Truy cập: http://localhost:8081/h2-console
# JDBC URL: jdbc:h2:file:./data/productdb (hoặc jdbc:h2:mem:productdb nếu chạy in-memory)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 5. Cấu hình xác thực qua Service Buổi 2 (SOA Inter-Service Authentication)
# URL API xác thực của Auth Service (Buổi 2 chạy cổng 8080)
auth.service.url=http://localhost:8080/auth
# Khóa bí mật dùng chung (theo buổi 2) để dự phòng giải mã token khi Auth Service tạm ngưng
auth.service.shared-secret=KhoaBiMatChoBaiThucHanhSo2SpringbootJwtSecurity2026
# Cho phép fallback giải mã cục bộ nếu Auth Service chưa bật: true / false
auth.service.fallback-local=true

