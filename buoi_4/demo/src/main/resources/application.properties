# Cong chay Order Service (doc lap voi 8080 cua Auth va 8081 cua Product)
server.port=8082
spring.application.name=order-service

# CSDL H2 Database rieng biet (tuan theo nguyen tac Database-per-Service cua kien truc SOA)
spring.datasource.url=jdbc:h2:file:./data/orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console quan ly CSDL
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Ket noi xac thuc sang Auth Service (Buoi 2 - Cong 8080)
auth.service.url=http://localhost:8080/auth
auth.service.shared-secret=KhoaBiMatChoBaiThucHanhSo2SpringbootJwtSecurity2026
auth.service.fallback-local=true

# Ket noi kiem tra ton kho sang Product Service (Buoi 3 - Cong 8081)
product.service.url=http://localhost:8081/products
product.service.deduct-stock-on-order=true
product.service.strict-mode=false

